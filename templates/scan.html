{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md border border-slate-200 text-center">
    <h2 class="text-xl font-bold text-slate-900 mb-1">Scan Wajah Absensi</h2>
    <p class="text-sm text-slate-500 mb-4">Posisikan wajah tepat di dalam bingkai kamera.</p>

    <!-- Pilih Lokasi -->
    <div class="mb-4 text-left">
        <label class="block text-sm font-medium text-slate-700 mb-1">Lokasi / Ruangan Absen</label>
        <select id="locationSelect" class="w-full rounded-md border border-slate-300 p-2 text-sm focus:border-indigo-500 focus:outline-none bg-white">
            {% for loc in locations %}
            <option value="{{ loc.id }}">{{ loc.name }}</option>
            {% endfor %}
        </select>
        <p class="text-xs text-slate-400 mt-1">Waktu scan akan menyesuaikan timezone lokasi ini.</p>
    </div>

    <div class="relative bg-black rounded-xl overflow-hidden aspect-video mx-auto mb-4 border-2 border-indigo-500 shadow-inner">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
    </div>

    <div id="statusBox" class="p-4 rounded-lg bg-slate-100 border border-slate-200">
        <p id="statusMsg" class="text-sm font-semibold text-slate-600">Menginisialisasi kamera...</p>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusMsg = document.getElementById('statusMsg');
    const statusBox = document.getElementById('statusBox');
    const locationSelect = document.getElementById('locationSelect');
    let isProcessing = false;

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then(stream => {
            video.srcObject = stream;
            statusMsg.innerText = "Kamera aktif. Mencari wajah...";
            setInterval(scanFrame, 2000); // Scan tiap 2 detik
        })
        .catch(err => {
            statusMsg.innerText = "Akses kamera ditolak!";
            statusBox.className = "p-4 rounded-lg bg-red-100 border border-red-300";
        });

    async function scanFrame() {
        if (isProcessing || video.readyState !== 4) return;
        isProcessing = true;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const base64Img = canvas.toDataURL('image/jpeg', 0.8);

        const selectedLocationId = locationSelect.value;

        try {
            const res = await fetch('/api/verify-face', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Img, location_id: selectedLocationId ? parseInt(selectedLocationId) : null })
            });
            const data = await res.json();

            if (data.status === 'success') {
                statusBox.className = "p-4 rounded-lg bg-green-100 border border-green-300";
                statusMsg.innerHTML = `✓ Absen Berhasil!<br><span class="text-base text-green-800 font-bold">${data.name}</span> (${data.nisn})<br><span class="text-xs text-slate-500">${data.location} &bull; ${data.time}</span>`;
                setTimeout(() => {
                    statusBox.className = "p-4 rounded-lg bg-slate-100 border border-slate-200";
                    statusMsg.innerText = "Mencari wajah...";
                }, 3500);
            } else if (data.status === 'unknown') {
                statusBox.className = "p-4 rounded-lg bg-yellow-100 border border-yellow-300";
                statusMsg.innerText = "Wajah terdeteksi namun tidak dikenal.";
            } else {
                statusBox.className = "p-4 rounded-lg bg-slate-100 border border-slate-200";
                statusMsg.innerText = "Arahkan wajah ke kamera...";
            }
        } catch (e) {
            console.error(e);
        } finally {
            isProcessing = false;
        }
    }
</script>
{% endblock %}
