<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Scan Wajah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <span class="font-bold text-lg tracking-wide">E-Absensi FaceScan</span>
            <div class="flex space-x-2">
                <a href="{{ url_for('dashboard') }}" class="hover:bg-indigo-700 px-3 py-2 rounded-md font-medium text-sm">Dashboard</a>
                <a href="{{ url_for('riwayat') }}" class="hover:bg-indigo-700 px-3 py-2 rounded-md font-medium text-sm">Riwayat</a>
                <a href="{{ url_for('scan_page') }}" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-2 rounded-md font-medium text-sm">Buka Scanner</a>
            </div>
        </div>
    </nav>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
